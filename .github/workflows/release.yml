name: Release

# Publish a GitHub release when a version tag such as v1.0.1 is pushed.
# A normal push to main does not create a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the tag matches the app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          cfg="$(sed -n 's/^[[:space:]]*version="\([^"]*\)".*/\1/p' app/config.xml | head -n 1)"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$cfg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg) and app/config.xml ($cfg)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the Tizen package
        run: npm run package:tv

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/HackerTube.wgt \
            --title "HackerTube $GITHUB_REF_NAME" \
            --generate-notes
